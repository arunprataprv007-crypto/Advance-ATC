<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalentTrack – Recruitment Command Center</title>
<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1e2235;--m:#6b7280;--b:#e5e7eb;--p:#6d4aff;--pl:#efeaff}
[data-theme=dark]{--bg:#12141f;--c:#1c1f2e;--t:#e8eaf3;--m:#9aa0b4;--b:#2c3046;--pl:#2a2446}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh}
aside{width:210px;background:var(--c);border-right:1px solid var(--b);padding:16px 10px;flex-shrink:0}
aside h2{color:var(--p);margin:0 6px 14px;font-size:18px}
aside a{display:block;padding:9px 12px;border-radius:8px;color:var(--t);cursor:pointer;margin-bottom:2px}
aside a:hover,aside a.on{background:var(--pl);color:var(--p)}
main{flex:1;padding:22px;overflow:auto;min-width:0}
h1{margin:0 0 16px;font-size:22px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px #0000000a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat b{display:block;font-size:28px;color:var(--p)}.stat span{font-size:11px;color:var(--m);text-transform:uppercase}
input,select,textarea{background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:8px 10px;font:inherit;min-width:0}
textarea{width:100%}button{background:var(--p);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
button.g{background:var(--c);color:var(--t);border:1px solid var(--b)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--m);font-weight:500}td,th{padding:8px 6px;border-top:1px solid var(--b)}tr.k{cursor:pointer}tr.k:hover{background:var(--pl)}
.tag{display:inline-block;background:var(--pl);color:var(--p);border-radius:20px;padding:2px 9px;font-size:12px;margin:1px}
.demo{background:#fef3c7;color:#92400e;border-radius:6px;padding:1px 6px;font-size:11px}
.kan{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}.col{min-width:170px;background:var(--pl);border-radius:10px;padding:8px;min-height:140px}
.col h4{margin:0 0 6px;font-size:12px;color:var(--p)}.kc{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px;margin-bottom:6px;cursor:grab;font-size:13px}
pre{white-space:pre-wrap;word-break:break-word;margin:4px 0}.bar{height:10px;background:var(--p);border-radius:5px}
.m{color:var(--m)}.ok{color:#059669}.no{color:#b45309}
#toast{position:fixed;bottom:18px;right:18px;background:var(--t);color:var(--bg);padding:10px 16px;border-radius:8px;display:none}
@media(max-width:700px){aside{width:64px}aside a{font-size:0}aside a:first-letter{font-size:14px}}
</style></head><body>
<aside id="nav"></aside><main id="app"></main><div id="toast"></div>
<script>
const STAGES=['Sourced','Applied','Shortlisted','CV Sent','Screening','Interview','Technical Interview','Final Interview','Offer','Hired','Rejected','On Hold'];
const SK=['java','spring boot','aws','kafka','microservices','python','react','node.js','sql','azure','terraform','docker','kubernetes','typescript','spark','dynamics 365','c#','.net'];
const SYN={'react':['React.js','ReactJS','React Developer','Frontend Engineer','UI Engineer'],'java':['Java Developer','Java Engineer','J2EE'],'aws':['Amazon Web Services','AWS Cloud'],'kafka':['Apache Kafka'],'microservices':['Microservice','Micro-services'],'dynamics 365':['D365','Microsoft Dynamics','Dynamics CRM','Dynamics CE'],'node.js':['NodeJS','Node'],'kubernetes':['K8s'],'python':['Python3'],'spring boot':['SpringBoot','Spring Framework'],'.net':['dotnet','ASP.NET'],'c#':['C Sharp','CSharp'],'javascript':['JS','ECMAScript'],'typescript':['TS']};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)};
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
function seed(){return{jobs:[
{id:1,title:'Senior Java Developer',client:'ABC Insurance',location:'London',type:'Contract',rate:'£550/day',status:'Active',priority:'High',skills:'Java, Spring Boot, AWS, Kafka, Microservices',desc:'',demo:1,date:'2026-09-01'},
{id:2,title:'Data Engineer',client:'XYZ Bank',location:'Manchester',type:'Permanent',rate:'£75k',status:'Active',priority:'Medium',skills:'Python, Spark, SQL, Azure',desc:'',demo:1,date:'2026-09-10'},
{id:3,title:'React Developer',client:'Retail Co',location:'Remote',type:'Contract',rate:'£450/day',status:'On Hold',priority:'Low',skills:'React, TypeScript, Node.js',desc:'',demo:1,date:'2026-09-15'}],
cands:[
{id:1,name:'John Smith',email:'john@demo.test',phone:'',location:'London',title:'Java Developer',years:9,notice:'2 weeks',skills:['java','spring boot','aws','kafka','microservices'],cv:'',demo:1},
{id:2,name:'Priya Patel',email:'priya@demo.test',phone:'',location:'Leeds',title:'Data Engineer',years:6,notice:'1 month',skills:['python','spark','sql','azure'],cv:'',demo:1},
{id:3,name:'Tom Becker',email:'tom@demo.test',phone:'',location:'London',title:'Full Stack Developer',years:5,notice:'Immediate',skills:['react','typescript','node.js','aws'],cv:'',demo:1},
{id:4,name:'Aisha Khan',email:'aisha@demo.test',phone:'',location:'Manchester',title:'Backend Engineer',years:7,notice:'4 weeks',skills:['java','kafka','docker','kubernetes'],cv:'',demo:1}],
links:[{c:1,j:1,stage:'Interview',match:92},{c:4,j:1,stage:'Screening',match:68},{c:2,j:2,stage:'Offer',match:90},{c:3,j:3,stage:'Shortlisted',match:85}],
log:[{t:'Demo data loaded',d:new Date().toISOString()}],n:10}}
let D=JSON.parse(ls.get('tt')||'null')||seed(),cur='dash',curJob=null;
const save=()=>ls.set('tt',JSON.stringify(D)),log=t=>{D.log.unshift({t,d:new Date().toISOString()});D.log=D.log.slice(0,50);save()};
const id=()=>D.n++;
const NAV=[['dash','Dashboard'],['jobs','Job Openings'],['pipe','Pipeline'],['cands','Candidates'],['match','Resume Matcher'],['bool','Boolean Search'],['ai','AI Studio'],['set','Settings']];
function go(v,j){cur=v;if(j)curJob=j;ls.get('x');draw()}
function draw(){$('#nav').innerHTML='<h2>TalentTrack</h2>'+NAV.map(([k,t])=>`<a class="${k==cur?'on':''}" onclick="go('${k}')">${t}</a>`).join('')+'<a onclick="theme()">◐ Theme</a>';V[cur]()}
function theme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme=='dark'?'':'dark';ls.set('th',d.dataset.theme)}
document.documentElement.dataset.theme=ls.get('th')||'';
const cnt=s=>D.links.filter(l=>s.includes(l.stage)).length;
const V={
dash(){const st=(t,n)=>`<div class="card stat"><span>${t}</span><b>${n}</b></div>`;
$('#app').innerHTML=`<h1>Dashboard</h1><div class="row" style="margin-bottom:14px"><button onclick="go('jobs')">+ Add Job</button><button onclick="go('cands')">+ Add Candidate</button><button class="g" onclick="go('cands')">Upload CVs</button><button class="g" onclick="go('match')">Match CVs</button><button class="g" onclick="go('bool')">Generate Boolean</button><button class="g" onclick="go('ai')">AI Recruiter</button></div>
<div class="grid">${st('Total Jobs',D.jobs.length)}${st('Active Jobs',D.jobs.filter(j=>j.status=='Active').length)}${st('On Hold',D.jobs.filter(j=>j.status=='On Hold').length)}${st('Candidates',D.cands.length)}${st('Screening',cnt(['Screening']))}${st('Interview',cnt(['Interview','Technical Interview','Final Interview']))}${st('Offer',cnt(['Offer']))}${st('Hired',cnt(['Hired']))}${st('Rejected',cnt(['Rejected']))}</div>
<div class="card"><b>Active jobs</b><table><tr><th>Job</th><th>Client</th><th>Location</th><th>Type</th><th>Rate</th><th>Priority</th><th>Cands</th><th>Screen</th><th>Int</th><th>Offer</th><th>Hired</th></tr>${D.jobs.filter(j=>j.status=='Active').map(j=>{const L=D.links.filter(l=>l.j==j.id),c=s=>L.filter(l=>s.includes(l.stage)).length;return`<tr class="k" onclick="go('pipe',${j.id})"><td>${esc(j.title)} ${j.demo?'<span class="demo">DEMO</span>':''}</td><td>${esc(j.client)}</td><td>${esc(j.location)}</td><td>${esc(j.type)}</td><td>${esc(j.rate)}</td><td>${j.priority}</td><td>${L.length}</td><td>${c(['Screening'])}</td><td>${c(['Interview','Technical Interview','Final Interview'])}</td><td>${c(['Offer'])}</td><td>${c(['Hired'])}</td></tr>`}).join('')||'<tr><td>No active jobs</td></tr>'}</table></div>
<div class="card"><b>Activity</b>${D.log.slice(0,8).map(a=>`<div class="m">${new Date(a.d).toLocaleString()} – <span style="color:var(--t)">${esc(a.t)}</span></div>`).join('')}</div>`},
jobs(){$('#app').innerHTML=`<h1>Job Openings</h1><div class="card row">${['title','client','location','type','rate','skills'].map(k=>`<input id="j_${k}" placeholder="${k}${k=='skills'?' (comma separated)':''}">`).join('')}<select id="j_status"><option>Active</option><option>On Hold</option><option>Closed</option><option>Filled</option></select><select id="j_priority"><option>Medium</option><option>High</option><option>Low</option></select><button onclick="addJob()">+ Create Job</button></div>
<div class="card"><table><tr><th>Title</th><th>Client</th><th>Location</th><th>Type</th><th>Rate</th><th>Status</th><th></th></tr>${D.jobs.map(j=>`<tr class="k"><td onclick="go('pipe',${j.id})">${esc(j.title)}</td><td>${esc(j.client)}</td><td>${esc(j.location)}</td><td>${esc(j.type)}</td><td>${esc(j.rate)}</td><td><select onchange="setJob(${j.id},this.value)">${['Active','On Hold','Closed','Filled'].map(s=>`<option ${s==j.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="g" onclick="delJob(${j.id})">Delete</button></td></tr>`).join('')}</table></div>`},
pipe(){const j=D.jobs.find(x=>x.id==curJob)||D.jobs[0];if(!j){$('#app').innerHTML='<h1>Pipeline</h1><p class="m">Create a job first.</p>';return}curJob=j.id;
$('#app').innerHTML=`<h1>Pipeline</h1><div class="row" style="margin-bottom:12px"><select onchange="curJob=+this.value;draw()">${D.jobs.map(x=>`<option value="${x.id}" ${x.id==j.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><span class="m">Drag candidates between stages.</span><button class="g" onclick="csvPipe()">Export CSV</button></div>
<div class="kan">${STAGES.map(s=>`<div class="col" ondragover="event.preventDefault()" ondrop="drop(event,'${s}')"><h4>${s} (${D.links.filter(l=>l.j==j.id&&l.stage==s).length})</h4>${D.links.filter(l=>l.j==j.id&&l.stage==s).map(l=>{const c=D.cands.find(x=>x.id==l.c);return`<div class="kc" draggable="true" ondragstart="event.dataTransfer.setData('t',${l.c})"><b>${esc(c.name)}</b><div class="m">${esc(c.title)}</div>${l.match!=null?`<span class="tag">${l.match}%</span>`:''}</div>`}).join('')}</div>`).join('')}</div>`},
cands(){$('#app').innerHTML=`<h1>Candidates</h1><div class="card"><b>Batch CV upload</b> <span class="m">(PDF, DOCX or TXT, or paste CV text)</span><div class="row" style="margin-top:8px"><input type="file" id="cvf" multiple accept=".txt,.pdf,.docx" onchange="upFiles(this.files)"><button class="g" onclick="pasteCV()">Parse pasted CV</button></div><textarea id="cvt" rows="3" placeholder="Paste CV text here…"></textarea><div id="uplog" class="m"></div></div>
<div class="card row">${['name','email','phone','location','title','years','notice','skills'].map(k=>`<input id="c_${k}" placeholder="${k}${k=='skills'?' (comma separated)':''}">`).join('')}<button onclick="addCand()">+ Add Candidate</button></div>
<div class="card"><div class="row"><input id="q" placeholder="Search name, skill, location…" oninput="listC()" style="flex:1"><button class="g" onclick="csvC()">Export CSV</button></div><div id="cl"></div></div>`;listC()},
match(){$('#app').innerHTML=`<h1>Resume Matcher</h1><div class="card row"><select id="mj">${D.jobs.map(j=>`<option value="${j.id}">${esc(j.title)}</option>`).join('')}</select><select id="ms"><option value="m">Highest match</option><option value="y">Most experience</option><option value="n">Notice period</option></select><button onclick="runMatch()">Match all candidates</button></div><div id="mr"></div>`},
bool(){$('#app').innerHTML=`<h1>Boolean Search</h1><div class="card row"><input id="b_t" placeholder="Job title"><input id="b_m" placeholder="Must-have skills (comma)" style="flex:1"><input id="b_n" placeholder="Nice-to-have (comma)"><input id="b_l" placeholder="Location"><button onclick="genBool()">Generate</button></div><div id="br"></div>`},
ai(){$('#app').innerHTML=`<h1>AI Studio</h1><div class="card"><div class="row"><select id="at">${[['recruiter','AI Recruiter'],['jd','JD Generator'],['resume','Resume Generator'],['email','Email'],['linkedin','LinkedIn Message'],['screening','Screening Questions'],['summary','Candidate Summary'],['visa','Visa Expert'],['compliance','Compliance']].map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select><select id="aj"><option value="">Job (optional)</option>${D.jobs.map(j=>`<option value="${j.id}">${esc(j.title)}</option>`).join('')}</select><select id="ac"><option value="">Candidate (optional)</option>${D.cands.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><select id="ao">${['Professional','Friendly','Short','Formal','Persuasive but professional'].map(t=>`<option>${t}</option>`).join('')}</select></div><textarea id="ai_in" rows="3" placeholder="Instructions / question…" style="margin-top:8px"></textarea><div class="row" style="margin-top:8px"><button onclick="runAI()">Generate</button><span class="m">Needs a free Gemini key in Settings.</span></div></div><div class="card" id="ao_out" style="display:none"><textarea id="ai_out" rows="16"></textarea><div class="row"><button class="g" onclick="runAI('Make it shorter')">Shorter</button><button class="g" onclick="runAI('Make it more professional')">More professional</button><button class="g" onclick="runAI('Regenerate with a fresh approach')">Regenerate</button><button class="g" onclick="navigator.clipboard.writeText($('#ai_out').value);toast('Copied')">Copy</button><button class="g" onclick="dlTxt()">Download .txt</button></div></div>`},
set(){$('#app').innerHTML=`<h1>Settings</h1><div class="card"><b>AI provider (free: Google Gemini)</b><p class="m">The AI keys (Groq / Gemini, both free) live in your Vercel environment variables (never in the browser). Use Test connection to verify it. Your jobs and candidates are stored in this browser only; use Backup regularly.</p><div class="row"><button class="g" onclick="testAI()">Test connection</button></div><p id="gs">Status: not tested</p></div>
<div class="card"><b>Data</b><div class="row" style="margin-top:8px"><button class="g" onclick="if(confirm('Reset to demo data? This erases your records.')){D=seed();save();toast('Reset');go('dash')}">Reset demo data</button><button class="g" onclick="exp()">Backup (JSON)</button><label class="g" style="padding:8px 14px;border:1px solid var(--b);border-radius:8px;cursor:pointer">Restore<input type="file" hidden accept=".json" onchange="imp(this.files[0])"></label></div></div>`}};
function addJob(){const g=k=>$('#j_'+k).value.trim();if(!g('title'))return toast('Job title is required');D.jobs.unshift({id:id(),title:g('title'),client:g('client'),location:g('location'),type:g('type'),rate:g('rate'),skills:g('skills'),status:$('#j_status').value,priority:$('#j_priority').value,desc:'',date:new Date().toISOString().slice(0,10)});log('Job created: '+g('title'));toast('Job created');draw()}
function setJob(i,s){D.jobs.find(j=>j.id==i).status=s;log('Job status → '+s);save()}
function delJob(i){if(!confirm('Delete this job and its pipeline?'))return;D.jobs=D.jobs.filter(j=>j.id!=i);D.links=D.links.filter(l=>l.j!=i);log('Job deleted');draw()}
function drop(e,s){e.preventDefault();const c=+e.dataTransfer.getData('t'),l=D.links.find(x=>x.c==c&&x.j==curJob);if(!l)return;l.stage=s;log(`${D.cands.find(x=>x.id==c).name} moved to ${s}`);draw()}
function mkCand(o){const dup=o.email&&D.cands.find(c=>c.email&&c.email.toLowerCase()==o.email.toLowerCase());if(dup){if(!confirm(`Possible duplicate candidate found: ${dup.name}.\nOK = update existing, Cancel = skip.`))return null;Object.assign(dup,Object.fromEntries(Object.entries(o).filter(([k,v])=>v&&v.length!==0)));log('Candidate updated: '+dup.name);return dup}
const c={id:id(),name:'',email:'',phone:'',location:'',title:'',years:'',notice:'',skills:[],cv:'',...o};D.cands.unshift(c);log('Candidate created: '+c.name);return c}
function addCand(){const g=k=>$('#c_'+k).value.trim();if(!g('name'))return toast('Name is required');mkCand({name:g('name'),email:g('email'),phone:g('phone'),location:g('location'),title:g('title'),years:g('years'),notice:g('notice'),skills:g('skills').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean)});save();draw()}
function parseCV(t,fn){const lines=t.split('\n').map(s=>s.trim()).filter(Boolean),low=t.toLowerCase();return{name:(lines[0]||fn||'Unknown').slice(0,50),email:(t.match(/[\w.+-]+@[\w-]+\.[\w.]+/)||[''])[0],phone:(t.match(/\+?\d[\d\s()-]{8,}\d/)||[''])[0],years:(t.match(/(\d+)\+?\s*years/i)||['',''])[1],skills:SK.filter(s=>low.includes(s)),cv:t}}
async function upFiles(fs){const out=$('#uplog');out.innerHTML='';let i=0;for(const f of fs){i++;let t;try{if(/\.(pdf|docx)$/i.test(f.name)){if(!window.SERVER)throw new Error('PDF/DOCX needs the backend');const r=await fetch('/api/parse',{method:'POST',headers:{'x-filename':encodeURIComponent(f.name),'Content-Type':'application/octet-stream'},body:f});const d=await r.json();if(!r.ok)throw new Error(d.error);t=d.text}else if(/\.txt$/i.test(f.name))t=await f.text();else throw new Error('file type not supported')}catch(e){out.innerHTML+=`<div class="no">⚠ ${esc(f.name)}: ${esc(e.message)}</div>`;continue}const c=mkCand(parseCV(t,f.name));out.innerHTML+=`<div class="ok">✓ ${i}/${fs.length} ${esc(f.name)} → ${esc(c?c.name:'skipped')}</div>`}save()}
function pasteCV(){const t=$('#cvt').value;if(t.length<50)return toast('Paste more CV text');const c=mkCand(parseCV(t));save();toast('Parsed: '+(c?c.name:'skipped'));listC()}
function listC(){const q=($('#q')?.value||'').toLowerCase(),L=D.cands.filter(c=>!q||(c.name+c.title+c.location+c.skills.join(' ')).toLowerCase().includes(q));$('#cl').innerHTML=`<table><tr><th>Name</th><th>Title</th><th>Location</th><th>Yrs</th><th>Notice</th><th>Skills</th><th></th></tr>${L.map(c=>`<tr><td>${esc(c.name)} ${c.demo?'<span class="demo">DEMO</span>':''}<div class="m">${esc(c.email)}</div></td><td>${esc(c.title)}</td><td>${esc(c.location)}</td><td>${esc(c.years)}</td><td>${esc(c.notice)}</td><td>${c.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</td><td><button class="g" onclick="delC(${c.id})">Delete</button></td></tr>`).join('')||'<tr><td>No candidates found.</td></tr>'}</table>`}
function delC(i){if(!confirm('Delete this candidate?'))return;D.cands=D.cands.filter(c=>c.id!=i);D.links=D.links.filter(l=>l.c!=i);log('Candidate deleted');save();listC()}
function runMatch(){const j=D.jobs.find(x=>x.id==$('#mj').value);if(!j)return toast('Create a job first');const req=j.skills.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
let R=D.cands.map(c=>{const hay=(c.cv||'').toLowerCase(),conf=req.filter(r=>c.skills.includes(r)||hay.includes(r));return{c,conf,miss:req.filter(r=>!conf.includes(r)),m:req.length?Math.round(conf.length/req.length*100):0}});
const s=$('#ms').value;R.sort((a,b)=>s=='y'?(+b.c.years||0)-(+a.c.years||0):s=='n'?String(a.c.notice).localeCompare(b.c.notice):b.m-a.m);
$('#mr').innerHTML=R.map(r=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(r.c.name)}</b><span style="color:var(--p);font-weight:700">${r.m}% match</span></div><div class="m">${esc(r.c.location||'Location not provided')} · ${esc(r.c.years||'Years not provided')} yrs · Notice: ${esc(r.c.notice||'Not provided')}</div><div><b>Confirmed:</b> ${r.conf.map(esc).join(', ')||'—'}</div><div><b>Not mentioned in CV:</b> ${r.miss.map(esc).join(', ')||'—'}</div><button class="g" style="margin-top:6px" onclick="shortlist(${r.c.id},${j.id},${r.m})">Shortlist</button></div>`).join('')||'<p class="m">No candidates yet.</p>';log(`Matched ${R.length} candidates to ${j.title}`)}
function shortlist(c,j,m){let l=D.links.find(x=>x.c==c&&x.j==j);if(l)l.match=m;else D.links.push({c,j,stage:'Shortlisted',match:m});log(`${D.cands.find(x=>x.id==c).name} shortlisted`);toast('Added to pipeline')}
function terms(s){const k=s.toLowerCase();return[s,...(SYN[k]||[])]}
const grp=a=>'('+a.map(x=>`"${x}"`).join(' OR ')+')';
function genBool(){const t=$('#b_t').value.trim(),m=$('#b_m').value.split(',').map(s=>s.trim()).filter(Boolean),n=$('#b_n').value.split(',').map(s=>s.trim()).filter(Boolean),l=$('#b_l').value.trim();if(!t&&!m.length)return toast('Enter a title or skills');
const tt=[t,t.replace(/^Senior /i,'')+' Engineer'].filter((x,i,a)=>x&&a.indexOf(x)==i),loc=l?` AND "${l}"`:'';
const strict=[t&&`"${t}"`,...m.map(x=>`"${x}"`)].filter(Boolean).join(' AND ')+loc;
const bal=[t&&grp(tt),...m.map(x=>grp(terms(x)))].filter(Boolean).join(' AND ')+(n.length?' AND ('+n.map(x=>grp(terms(x))).join(' OR ')+')':'')+loc;
const broad=(t?grp(tt)+' AND ':'')+'('+m.concat(n).flatMap(terms).map(x=>`"${x}"`).join(' OR ')+')';
const ex=m.concat(n).filter(x=>SYN[x.toLowerCase()]).map(x=>`<div>${esc(x)} → ${SYN[x.toLowerCase()].map(esc).join(', ')}<div class="m">Reason: common naming variations / abbreviations</div></div>`).join('')||'<span class="m">No expansions for these terms.</span>';

const RULES='You are a recruitment assistant. Use ONLY facts in the provided context. Never invent employers, skills, dates, visas, clearance, salary or qualifications; write "Not provided" when missing. Not mentioned is not the same as does not have. For visa/compliance questions give informational guidance only (not legal advice) with headings: Information / Potential issue / Information to verify / Verification required.';
async function gem(p){const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'AI request failed');window.LASTP=d.provider;return d.text}
async function runAI(x=''){try{const j=D.jobs.find(a=>a.id==$('#aj').value),c=D.cands.find(a=>a.id==$('#ac').value),t=$('#at').value;
const ctx=(j?`JOB: ${j.title} | ${j.client} | ${j.location} | ${j.type} | ${j.rate} | Skills: ${j.skills}\n`:'')+(c?`CANDIDATE: ${c.name} | ${c.title} | ${c.location} | Notice: ${c.notice||'Not provided'} | Skills: ${c.skills.join(', ')}\nCV:\n${(c.cv||'').slice(0,10000)}\n`:'');
const T={recruiter:'Act as a recruitment copilot and answer the request.',jd:'Write a job description (summary, responsibilities, required/preferred skills, experience, location, contract details). Never invent salary, benefits or client info.',resume:'Create a recruiter-ready CV tailored to the job from the candidate info ONLY. Never invent anything.',email:'Write a recruitment email with a Subject line and body.',linkedin:'Write LinkedIn messages: connection request (<300 chars), initial message, two follow-ups, InMail.',screening:'Create 12 screening questions.',summary:'Write a concise candidate summary for a client; label inferences as AI inference.',visa:'Answer this work-authorization question.',compliance:'Answer this recruitment compliance question (GDPR, right to work, consent, CV handling).'}[t];
toast('Generating…');const prev=x?`\nRevise this previous output: ${x}.\n${$('#ai_out').value}`:'';
const out=await gem(`${T}\n${ctx}Tone: ${$('#ao').value}. Instructions: ${$('#ai_in').value||'none'}${prev}`);$('#ao_out').style.display='block';$('#ai_out').value=out;log('AI '+t+' generated')}catch(e){toast(e.message)}}
const dlTxt=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#ai_out').value]));a.download='output.txt';a.click()};
async function testAI(){const g=$('#gs');g.textContent='Testing…';try{const h=await(await fetch('/api/health')).json();await gem('Reply with OK');g.textContent=`Status: Connected ✓ via ${window.LASTP}. Configured: ${(h.configured||[]).join(', ')||'none'}`}catch(e){g.textContent='Status: '+e.message}}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
